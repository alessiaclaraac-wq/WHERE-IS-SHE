<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Birthday</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #f4f1ea;
    overflow: hidden;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
}


/* =========================================================
   SCENA
========================================================= */

.container {
    width: 100%;
    text-align: center;
    transition: opacity .4s ease;
}


/* =========================================================
   TITOLO
========================================================= */

h1 {
    font-size: 28px;
    font-weight: 400;
    letter-spacing: 2px;

    margin: 0 0 15px;
}

.instruction {
    font-size: 15px;
    letter-spacing: 1px;

    margin-bottom: 20px;
}


/* =========================================================
   TORTA
========================================================= */

.cake-wrapper {
    position: relative;

    width: 95vw;
    max-width: 1200px;

    margin: 0 auto;

    cursor: pointer;
}

.cake-wrapper svg {
    display: block;

    width: 100%;
    height: auto;
}


/* =========================================================
   LINEE TORTA
========================================================= */

.line {
    fill: none;

    stroke: #111;
    stroke-width: 3;

    stroke-linecap: round;
    stroke-linejoin: round;
}

.icing {
    fill: #c88b52;

    stroke: #111;
    stroke-width: 3;

    stroke-linejoin: round;
}


/* =========================================================
   CANDELA
========================================================= */

.candle {
    fill: white;

    stroke: #111;
    stroke-width: 3;

    stroke-linecap: round;
    stroke-linejoin: round;
}


/* =========================================================
   MICCIA + FIAMMA
========================================================= */

.candle-box {
    position: absolute;

    width: 60px;
    height: 160px;

    left: 50.2%;
    top: 11.35%;

    transform: translateX(-50%);

    pointer-events: none;
}


/* =========================================================
   MICCIA
========================================================= */

.wick {
    position: absolute;

    bottom: 120px;
    left: 50%;

    width: 4px;
    height: 15px;

    background: #333;

    transform: translateX(-50%);

    border-radius: 2px;

    z-index: 5;
}


/* =========================================================
   FIAMMA
========================================================= */

.flame {
    position: absolute;

    bottom: 130px;
    left: 50%;

    width: 24px;
    height: 42px;

    transform:
        translateX(-50%)
        rotate(0deg);

    transform-origin: bottom center;

    opacity: 0;

    transition: opacity .15s ease;

    animation:
        flicker
        .8s
        infinite
        alternate
        ease-in-out;

    background:
        linear-gradient(
            to top,
            #ff6a00 0%,
            #ff9900 38%,
            #ffcc33 70%,
            #fff2a8 100%
        );

    border-radius:
        55% 45% 55% 45%;

    clip-path:
        polygon(
            50% 0%,
            68% 24%,
            82% 45%,
            78% 68%,
            66% 86%,
            50% 100%,
            34% 86%,
            22% 68%,
            18% 48%,
            32% 27%
        );

    filter:
        drop-shadow(
            0 0 5px rgba(255,130,20,0.8)
        )
        drop-shadow(
            0 0 13px rgba(255,180,40,0.65)
        );

    z-index: 10;
}


/* =========================================================
   PARTE INTERNA FIAMMA
========================================================= */

.flame::after {

    content: "";

    position: absolute;

    left: 50%;
    bottom: 3px;

    width: 11px;
    height: 23px;

    transform: translateX(-50%);

    background:
        linear-gradient(
            to top,
            #fffef0,
            #fffbd0 45%,
            #ffd94a
        );

    clip-path:
        polygon(
            50% 100%,
            30% 82%,
            25% 62%,
            38% 43%,
            42% 22%,
            55% 0%,
            60% 25%,
            75% 48%,
            76% 70%,
            65% 87%
        );
}


/* =========================================================
   ANIMAZIONE FIAMMA
========================================================= */

@keyframes flicker {

    0% {
        transform:
            translateX(-50%)
            rotate(-3deg)
            scale(.94);

        opacity: .88;
    }

    25% {
        transform:
            translateX(-50%)
            rotate(2deg)
            scale(1.02);

        opacity: .96;
    }

    50% {
        transform:
            translateX(-50%)
            rotate(-1deg)
            scale(.97);

        opacity: .92;
    }

    75% {
        transform:
            translateX(-50%)
            rotate(3deg)
            scale(1.05);

        opacity: 1;
    }

    100% {
        transform:
            translateX(-50%)
            rotate(-2deg)
            scale(.98);

        opacity: .95;
    }
}


/* =========================================================
   SCRITTA SOTTO LA TORTA
========================================================= */

.hint {

    margin-top: 8px;

    font-size: 10px;
    font-weight: 300;

    letter-spacing: 3px;

    opacity: .48;

    transition:
        opacity .2s ease,
        letter-spacing .2s ease;
}


/* =========================================================
   MESSAGGIO FINALE
========================================================= */

.final-message {

    display: none;

    position: fixed;

    inset: 0;

    justify-content: center;
    align-items: center;

    flex-direction: column;

    background: #f4f1ea;

    z-index: 100;
}

.final-message.show {
    display: flex;
}


/* =========================================================
   TESTO FINALE
========================================================= */

.message-text {

    font-family:
        "Snell Roundhand",
        "Segoe Script",
        "Bradley Hand",
        "Brush Script MT",
        cursive;

    font-size: 52px;
    font-weight: 400;

    color: #222;
}


/* =========================================================
   CUORE
========================================================= */

.heart {

    font-size: 80px;

    margin-top: 5px;

    animation:
        heartPulse
        1.5s
        ease-in-out
        infinite;
}


@keyframes heartPulse {

    0%,
    100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.08);
    }
}

</style>
</head>


<body>


<!-- =========================================================
     SCENA
========================================================= -->

<div class="container" id="scene">


    <h1>
        DEACHE TÖ T'ES MIA LÖM...
    </h1>


    <div class="instruction">
        Make a wish.
    </div>


    <!-- =====================================================
         TORTA
    ====================================================== -->

    <div class="cake-wrapper" id="cake">


        <svg
            viewBox="0 0 1200 625"
            xmlns="http://www.w3.org/2000/svg"
        >

            <!-- LINEA ORIZZONTALE -->

            <path
                class="line"
                d="
                    M 8 430
                    C 190 430 310 430 450 430
                    L 455 430
                "
            />

            <path
                class="line"
                d="
                    M 745 430
                    C 900 430 1040 430 1195 430
                "
            />


            <!-- BASE DELLA TORTA -->

            <path
                class="line"
                d="
                    M 470 430
                    L 470 331
                    C 470 323 477 317 487 317
                    L 700 317
                    C 715 317 723 323 725 335
                    L 730 430
                "
            />


            <!-- BORDO SUPERIORE -->

            <path
                class="line"
                d="
                    M 471 331
                    C 500 325 545 323 595 323
                    C 650 323 700 325 722 333
                "
            />


            <!-- GLASSA PIANO INFERIORE -->

            <path
                class="icing"
                d="
                    M 480 331
                    C 530 325 625 325 715 331

                    L 715 358

                    C 702 349 696 348 688 355
                    C 680 363 674 379 665 381
                    C 655 383 649 368 640 360
                    C 631 352 622 353 614 361
                    C 605 370 600 382 590 383
                    C 580 384 574 368 566 360
                    C 557 351 548 351 540 360
                    C 531 370 526 382 516 382
                    C 506 381 502 365 494 358
                    C 488 353 484 354 480 359

                    Z
                "
            />


            <!-- PIANO SUPERIORE -->

            <path
                class="line"
                d="
                    M 510 317
                    L 510 218
                    C 510 210 517 205 528 205
                    L 680 205
                    C 692 205 699 210 700 220
                    L 700 317
                "
            />


            <!-- GLASSA PIANO SUPERIORE -->

            <path
                class="icing"
                d="
                    M 518 220
                    C 555 213 640 213 692 220

                    L 692 246

                    C 684 239 678 237 671 242
                    C 662 248 659 262 650 264
                    C 641 266 635 252 627 245
                    C 619 238 610 238 603 246
                    C 594 255 590 267 581 268
                    C 572 269 566 254 558 246
                    C 550 238 541 239 534 247
                    C 527 254 522 263 518 264

                    Z
                "
            />


            <!-- CANDELA SPENTA -->

            <path
                class="candle"
                d="
                    M 595 205
                    L 595 147

                    C 595 140 601 136 605 130
                    C 609 124 609 118 605 113
                    C 601 108 596 109 594 115
                    C 592 121 597 127 602 131

                    C 608 136 610 142 610 147

                    L 610 205
                    Z
                "
            />

        </svg>


        <!-- MICCIA + FIAMMA -->

        <div class="candle-box">

            <div class="wick"></div>

            <div
                class="flame"
                id="flame"
            ></div>

        </div>

    </div>


    <!-- =====================================================
         TESTO SOTTO LA TORTA
    ====================================================== -->

    <div
        class="hint"
        id="hint"
    >
        LIGHT THE CANDLE
    </div>


</div>



<!-- =========================================================
     MESSAGGIO FINALE
========================================================= -->

<div
    class="final-message"
    id="finalMessage"
>

    <div class="message-text">
        Döt l'bun pice
    </div>

    <div class="heart">
        ♥
    </div>

</div>



<script>

let candleLit = false;

const cake =
    document.getElementById("cake");

const flame =
    document.getElementById("flame");

const hint =
    document.getElementById("hint");

const scene =
    document.getElementById("scene");

const finalMessage =
    document.getElementById("finalMessage");


/* =========================================================
   STATO INIZIALE
========================================================= */

flame.style.opacity = "0";


/* =========================================================
   CLICK
========================================================= */

cake.addEventListener("click", () => {


    /* =====================================================
       PRIMO CLICK
    ===================================================== */

    if (!candleLit) {

        candleLit = true;

        flame.style.opacity = "1";

        hint.textContent = "MAKE A WISH";

    }


    /* =====================================================
       SECONDO CLICK
    ===================================================== */

    else {

        flame.style.opacity = "0";

        scene.style.opacity = "0";


        setTimeout(() => {

            scene.style.display = "none";

            finalMessage.classList.add("show");

        }, 400);

    }

});

</script>

</body>
</html>
