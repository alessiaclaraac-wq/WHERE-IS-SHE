  font-size: 17px;

  line-height: 1.55;

  font-style: italic;

  transition:
    opacity 1.2s ease,
    transform 1.2s ease;
}

/* =====================================================
   DRAWN CANDLE
===================================================== */

.candle-box {

  position: absolute;

  width: 46px;
  height: 125px;

  left: 50%;
  top: -3px;

  transform: translateX(-50%);

  z-index: 10;

  pointer-events: none;
}

/* -----------------------------------------------------
   WICK
----------------------------------------------------- */

.wick {

  position: absolute;

  bottom: 78px;

  left: 50%;

  width: 4px;
  height: 15px;

  transform: translateX(-50%);

  background:
    linear-gradient(
      to right,
      #171717,
      #4a443d,
      #171717
    );

  border-radius: 2px;

  z-index: 12;
}


/* -----------------------------------------------------
   FLAME
----------------------------------------------------- */

.flame {

  position: absolute;

  bottom: 88px;

  left: 50%;

  width: 22px;
  height: 39px;

  transform:
    translateX(-50%)
    rotate(-2deg)
    scale(.95);

  transform-origin: bottom center;

  opacity: 0;

  z-index: 13;

  /*
    Layered gradients make the flame
    look less like a simple icon.
  */

  background:
    radial-gradient(
      ellipse at 50% 70%,
      #fffde7 0%,
      #fff5a8 20%,
      #ffd447 45%,
      #ff9d00 72%,
      #e85d00 100%
    );

  border-radius:
    55% 45% 55% 45%;

  filter:
    drop-shadow(0 0 5px rgba(255,153,0,.75))
    drop-shadow(0 0 13px rgba(255,180,0,.35));

  transition:
    opacity .45s ease;

  animation:
    flicker .75s infinite alternate ease-in-out;
}


/* inner flame */

.flame::after {

  content: "";

  position: absolute;

  width: 9px;
  height: 19px;

  left: 6px;
  bottom: 5px;

  background:
    radial-gradient(
      ellipse at center,
      #ffffff 0%,
      #fffde0 45%,
      #ffe76a 100%
    );

  border-radius:
    60% 40% 55% 45%;

  transform:
    rotate(-4deg);
}


/* flame tip */

.flame::before {

  content: "";

  position: absolute;

  width: 9px;
  height: 16px;

  left: 8px;
  top: -8px;

  background:
    linear-gradient(
      135deg,
      #ffb300,
      #ff7a00
    );

  border-radius:
    70% 30% 60% 40%;

  transform:
    rotate(-14deg);
}


/* =====================================================
   FLAME ON
===================================================== */

.cake.lit .flame {

  opacity: 1;

}


/* =====================================================
   FLAME ANIMATION
===================================================== */

@keyframes flicker {

  0% {

    transform:
      translateX(-50%)
      rotate(-4deg)
      scale(.94);

  }

  25% {

    transform:
      translateX(-50%)
      rotate(2deg)
      scale(1.02);

  }

  50% {

    transform:
      translateX(-50%)
      rotate(-2deg)
      scale(.97);

  }

  75% {

    transform:
      translateX(-50%)
      rotate(4deg)
      scale(1.06);

  }

  100% {

    transform:
      translateX(-50%)
      rotate(-1deg)
      scale(1);

  }

}


/* =====================================================
   HINT
===================================================== */

.hint {

  margin-top: 20px;

  font-size: 10px;

  letter-spacing: .15em;

  opacity: .55;

  transition:
    opacity 1s ease,
    transform 1s ease;
}


.hint.hidden {

  opacity: 0;

}


/* =====================================================
   FINAL SCENE
===================================================== */

.page.final-scene h1,
.page.final-scene .instruction,
.page.final-scene .cake-area,
.page.final-scene .hint {

  opacity: 0;

  transform:
    translateY(-15px)
    scale(.96);

  pointer-events: none;
}


/* =====================================================
   FINAL MESSAGE
===================================================== */

.message {

  position: fixed;

  left: 50%;
  top: 50%;

  width: 90%;
  max-width: 700px;

  transform:
    translate(-50%, -47%)
    scale(.92);

  opacity: 0;

  pointer-events: none;

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  transition:
    opacity 2s cubic-bezier(.22,1,.36,1),
    transform 2s cubic-bezier(.22,1,.36,1);
}


/* =====================================================
   CALLIGRAPHIC TEXT
===================================================== */

.message-text {

  font-family:
    "Snell Roundhand",
    "Segoe Script",
    "Bradley Hand",
    "Brush Script MT",
    cursive;

  font-size:
    clamp(43px, 9vw, 76px);

  font-weight: 400;

  letter-spacing: .01em;

  line-height: 1;

  color: #171717;

  opacity: 0;

  transform:
    translateY(20px);

  transition:
    opacity 1.8s ease,
    transform 1.8s cubic-bezier(.22,1,.36,1);
}


/* =====================================================
   LARGE HEART
===================================================== */

.message-heart {

  margin-top: 34px;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:
    clamp(70px, 15vw, 110px);

  line-height: .7;

  color: #171717;

  opacity: 0;

  transform:
    translateY(20px)
    scale(.55);

  transition:
    opacity 1.5s ease 1s,
    transform 1.7s cubic-bezier(.22,1,.36,1) 1s;
}


/* =====================================================
   FINAL MESSAGE VISIBLE
===================================================== */

.page.final-scene .message {

  opacity: 1;

  transform:
    translate(-50%, -50%)
    scale(1);
}


.page.final-scene .message-text {

  opacity: 1;

  transform:
    translateY(0);
}


.page.final-scene .message-heart {

  opacity: 1;

  transform:
    translateY(0)
    scale(1);

  animation:
    heartPulse 3.2s ease-in-out 2.5s infinite;
}


/* =====================================================
   HEART ANIMATION
===================================================== */

@keyframes heartPulse {

  0%,
  100% {

    transform:
      translateY(0)
      scale(1);

  }

  50% {

    transform:
      translateY(0)
      scale(1.07);

  }

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 500px) {

  h1 {
    font-size: 22px;
  }

  .instruction {
    font-size: 16px;
  }

  .cake {
    transform: scale(.92);
  }

  .message-text {
    white-space: normal;
  }

}

<script>

/* =====================================================
   ELEMENTS
===================================================== */

const page =
  document.getElementById("page");

const cakeArea =
  document.getElementById("cakeArea");

const cake =
  document.getElementById("cake");

const hint =
  document.getElementById("hint");


/* =====================================================
   STATE
===================================================== */

let lit = false;

let finished = false;


/* =====================================================
   CLICK
===================================================== */

cakeArea.addEventListener("click", function() {


  if (finished) {
    return;
  }


  /* -----------------------------------------------
     FIRST CLICK
     LIGHT CANDLE
  ------------------------------------------------ */

  if (!lit) {

    lit = true;

    cake.classList.add("lit");

    hint.textContent = "MAKE A WISH";

    return;
  }


  /* -----------------------------------------------
     SECOND CLICK
     EXTINGUISH CANDLE
  ------------------------------------------------ */

  lit = false;

  cake.classList.remove("lit");


  /*
    Let the flame disappear first.
  */

  setTimeout(function() {

    page.classList.add("final-scene");

    finished = true;

  }, 500);

});

</script>
