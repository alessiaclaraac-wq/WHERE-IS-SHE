<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A LIGHT FROM NEPAL</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #f4f1ea;
  color: #171717;
  font-family: Arial, Helvetica, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
}

.page {
  width: 90%;
  max-width: 520px;
  padding: 40px 20px;
}

h1 {
  margin: 0 0 22px;
  font-size: 25px;
  font-weight: 400;
  letter-spacing: .03em;
}

.instruction {
  margin: 0 0 45px;
  min-height: 26px;
  font-size: 17px;
  line-height: 1.55;
  font-style: italic;
}

.cake-area {
  display: flex;
  flex-direction: column;
  align-items: center;
  cursor: pointer;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

/* CANDLE */

.candle-wrap {
  position: relative;
  width: 24px;
  height: 75px;
  z-index: 5;
}

.candle {
  position: absolute;
  left: 7px;
  bottom: 0;
  width: 10px;
  height: 52px;
  border-radius: 2px 2px 1px 1px;
  background:
    repeating-linear-gradient(
      100deg,
      #eee9df 0px,
      #eee9df 3px,
      #d8d1c6 4px,
      #eee9df 7px
    );
  box-shadow:
    inset 1px 0 rgba(255,255,255,.7),
    inset -1px 0 rgba(0,0,0,.12);
}

.wick {
  position: absolute;
  left: 50%;
  top: -5px;
  width: 2px;
  height: 7px;
  background: #171717;
  transform: translateX(-50%);
}

.flame {
  position: absolute;
  left: 50%;
  top: -30px;
  width: 18px;
  height: 28px;
  transform: translateX(-50%) rotate(45deg);
  transform-origin: center bottom;
  border-radius: 70% 40% 65% 40%;
  background:
    radial-gradient(
      circle at 55% 65%,
      #fff 0%,
      #fff 18%,
      #ddd 25%,
      #777 48%,
      #171717 72%
    );
  opacity: 0;
  filter: blur(.1px);
}

.candle.lit .flame {
  opacity: 1;
  animation: flame 0.65s ease-in-out infinite alternate;
}

@keyframes flame {
  0% {
    transform: translateX(-50%) rotate(43deg) scale(.95);
  }
  50% {
    transform: translateX(-50%) rotate(48deg) scale(1.05);
  }
  100% {
    transform: translateX(-50%) rotate(42deg) scale(.98);
  }
}

/* CAKE */

.cake {
  position: relative;
  width: 250px;
  height: 155px;
  filter: drop-shadow(0 8px 7px rgba(0,0,0,.12));
}

/* top of cake */

.cake-top {
  position: absolute;
  left: 12px;
  top: 12px;
  width: 226px;
  height: 62px;
  border-radius: 50%;
  background:
    radial-gradient(
      ellipse at 50% 45%,
      #f9f7f2 0%,
      #e4ded4 45%,
      #c8c0b5 72%,
      #a9a096 100%
    );
  border: 1px solid #aaa39a;
  z-index: 3;
}

/* cake sides */

.cake-side {
  position: absolute;
  left: 12px;
  top: 42px;
  width: 226px;
  height: 91px;
  border-radius: 5px 5px 22px 22px;
  background:
    linear-gradient(
      90deg,
      #8f8780 0%,
      #bdb5ab 12%,
      #d8d1c8 28%,
      #c4bcb2 52%,
      #ded8d0 72%,
      #aaa29a 90%,
      #89817b 100%
    );
  border: 1px solid #928a83;
  overflow: hidden;
  z-index: 2;
}

/* cream layer */

.cream {
  position: absolute;
  left: 12px;
  top: 53px;
  width: 226px;
  height: 25px;
  border-radius: 0 0 50% 50%;
  background:
    linear-gradient(
      to bottom,
      #faf8f3 0%,
      #e8e2d9 55%,
      #cfc8be 100%
    );
  z-index: 4;
}

/* cream drips */

.drip {
  position: absolute;
  top: 64px;
  width: 17px;
  background: linear-gradient(to right, #eee9e1, #cfc8be);
  border-radius: 0 0 10px 10px;
  z-index: 5;
}

.drip.d1 {
  left: 37px;
  height: 25px;
}

.drip.d2 {
  left: 78px;
  height: 18px;
}

.drip.d3 {
  left: 130px;
  height: 29px;
}

.drip.d4 {
  left: 177px;
  height: 20px;
}

/* second cream line */

.cream-line {
  position: absolute;
  left: 25px;
  top: 103px;
  width: 200px;
  height: 9px;
  border-radius: 50%;
  background: rgba(245,241,235,.5);
  z-index: 5;
}

/* subtle cake texture */

.texture {
  position: absolute;
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: rgba(255,255,255,.35);
  z-index: 6;
}

.t1 { left: 45px; top: 87px; }
.t2 { left: 67px; top: 116px; }
.t3 { left: 102px; top: 91px; }
.t4 { left: 145px; top: 121px; }
.t5 { left: 181px; top: 94px; }
.t6 { left: 205px; top: 113px; }

/* hint */

.hint {
  margin-top: 25px;
  font-size: 10px;
  letter-spacing: .15em;
  opacity: .55;
  transition: opacity .5s ease;
}

.hint.hidden {
  opacity: 0;
}

/* final message */

.message {
  margin-top: 48px;
  font-size: 20px;
  letter-spacing: .02em;
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 1.5s ease, transform 1.5s ease;
  pointer-events: none;
}

.message.visible {
  opacity: 1;
  transform: translateY(0);
}
</style>
</head>

<body>

<div class="page">

  <h1>A LIGHT FROM NEPAL</h1>

  <p class="instruction" id="instruction">
    Make a wish.
  </p>

  <div class="cake-area" id="cakeArea">

    <div class="candle-wrap">
      <div class="candle" id="candle">
        <div class="wick"></div>
        <div class="flame"></div>
      </div>
    </div>

    <div class="cake">

      <div class="cake-side"></div>

      <div class="cake-top"></div>

      <div class="cream"></div>

      <div class="drip d1"></div>
      <div class="drip d2"></div>
      <div class="drip d3"></div>
      <div class="drip d4"></div>

      <div class="cream-line"></div>

      <div class="texture t1"></div>
      <div class="texture t2"></div>
      <div class="texture t3"></div>
      <div class="texture t4"></div>
      <div class="texture t5"></div>
      <div class="texture t6"></div>

    </div>

  </div>

  <div class="hint" id="hint">
    LIGHT THE CANDLE
  </div>

  <div class="message" id="message">
    Döt l'bun Pice ❤️
  </div>

</div>

<script>

const cakeArea = document.getElementById("cakeArea");
const candle = document.getElementById("candle");
const instruction = document.getElementById("instruction");
const hint = document.getElementById("hint");
const message = document.getElementById("message");

let lit = false;
let finished = false;

cakeArea.addEventListener("click", function() {

  if (finished) return;

  if (!lit) {

    lit = true;
    candle.classList.add("lit");

    hint.textContent = "BLOW IT OUT";

  } else {

    lit = false;
    candle.classList.remove("lit");

    instruction.textContent = "";
    hint.classList.add("hidden");

    setTimeout(function() {
      message.classList.add("visible");
      finished = true;
    }, 900);

  }

});

</script>

</body>
</html>
