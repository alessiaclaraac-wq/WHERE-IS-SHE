<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DEACHE TÖ T'ES MIA LÖM...</title>

<style>

/* =====================================================
   GENERAL
===================================================== */

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;

  background: #f4f1ea;
  color: #171717;

  font-family: Arial, Helvetica, sans-serif;

  display: flex;
  justify-content: center;
  align-items: center;

  text-align: center;

  overflow: hidden;
}


/* =====================================================
   PAGE
===================================================== */

.page {
  width: 90%;
  max-width: 520px;

  padding: 40px 20px;

  transition:
    opacity 1.6s ease,
    transform 1.6s cubic-bezier(.22,1,.36,1);
}


/* =====================================================
   TITLE
===================================================== */

h1 {
  margin: 0 0 24px;

  font-size: 25px;
  font-weight: 400;

  letter-spacing: .03em;
  line-height: 1.35;

  transition:
    opacity 1.2s ease,
    transform 1.2s ease;
}


.instruction {
  margin: 0 0 55px;

  min-height: 26px;

  font-size: 17px;

  line-height: 1.55;

  font-style: italic;

  transition:
    opacity 1.2s ease,
    transform 1.2s ease;
}


/* =====================================================
   CAKE AREA
===================================================== */

.cake-area {

  display: flex;

  flex-direction: column;

  align-items: center;

  cursor: pointer;

  user-select: none;

  -webkit-tap-highlight-color: transparent;

  transition:
    opacity 1.4s ease,
    transform 1.4s cubic-bezier(.22,1,.36,1);
}


.cake {

  position: relative;

  width: 230px;
  height: 210px;

  transition:
    transform .35s ease,
    opacity 1.3s ease;
}


.cake:hover {
  transform: scale(1.025);
}


/* =====================================================
   CAKE DRAWING
===================================================== */

.cake svg {

  width: 100%;
  height: 100%;

  overflow: visible;
}


/* =====================================================
   DRAWN CANDLE
===================================================== */

.candle-box {

  position: absolute;

  width: 46px;
  height: 125px;

  left: 50%;
  top: -3px;

  transform: translateX(-50%);

  z-index: 10;

  pointer-events: none;
}


/* -----------------------------------------------------
   CANDLE BODY
----------------------------------------------------- */

.candle-body {

  position: absolute;

  bottom: 0;

  left: 50%;

  width: 42px;
  height: 78px;

  transform: translateX(-50%);

  background:
    linear-gradient(
      90deg,
      #d8d2c6 0%,
      #f8f6ef 22%,
      #ffffff 50%,
      #e8e3d9 78%,
      #cfc8bb 100%
    );

  border-radius: 5px 5px 3px 3px;

  border: 1.5px solid #171717;

  box-shadow:
    inset -7px 0 12px rgba(0,0,0,.10),
    inset 5px 0 10px rgba(255,255,255,.65);
}


/* little wax edge */

.candle-body::before {

  content: "";

  position: absolute;

  top: -3px;
  left: -1px;

  width: 41px;
  height: 7px;

  border-radius: 50%;

  background: #f8f6ef;

  border: 1.5px solid #171717;
}


/* subtle candle detail */

.candle-body::after {

  content: "";

  position: absolute;

  top: 17px;
  left: 7px;

  width: 3px;
  height: 45px;

  border-radius: 50%;

  background: rgba(255,255,255,.7);
}


/* -----------------------------------------------------
   WICK
----------------------------------------------------- */

.wick {

  position: absolute;

  bottom: 78px;

  left: 50%;

  width: 4px;
  height: 15px;

  transform: translateX(-50%);

  background:
    linear-gradient(
      to right,
      #171717,
      #4a443d,
      #171717
    );

  border-radius: 2px;

  z-index: 12;
}


/* -----------------------------------------------------
   FLAME
----------------------------------------------------- */

.flame {

  position: absolute;

  bottom: 88px;

  left: 50%;

  width: 22px;
  height: 39px;

  transform:
    translateX(-50%)
    rotate(-2deg)
    scale(.95);

  transform-origin: bottom center;

  opacity: 0;

  z-index: 13;

  /*
    Layered gradients make the flame
    look less like a simple icon.
  */

  background:
    radial-gradient(
      ellipse at 50% 70%,
      #fffde7 0%,
      #fff5a8 20%,
      #ffd447 45%,
      #ff9d00 72%,
      #e85d00 100%
    );

  border-radius:
    55% 45% 55% 45%;

  filter:
    drop-shadow(0 0 5px rgba(255,153,0,.75))
    drop-shadow(0 0 13px rgba(255,180,0,.35));

  transition:
    opacity .45s ease;

  animation:
    flicker .75s infinite alternate ease-in-out;
}


/* inner flame */

.flame::after {

  content: "";

  position: absolute;

  width: 9px;
  height: 19px;

  left: 6px;
  bottom: 5px;

  background:
    radial-gradient(
      ellipse at center,
      #ffffff 0%,
      #fffde0 45%,
      #ffe76a 100%
    );

  border-radius:
    60% 40% 55% 45%;

  transform:
    rotate(-4deg);
}


/* flame tip */

.flame::before {

  content: "";

  position: absolute;

  width: 9px;
  height: 16px;

  left: 8px;
  top: -8px;

  background:
    linear-gradient(
      135deg,
      #ffb300,
      #ff7a00
    );

  border-radius:
    70% 30% 60% 40%;

  transform:
    rotate(-14deg);
}


/* =====================================================
   FLAME ON
===================================================== */

.cake.lit .flame {

  opacity: 1;

}


/* =====================================================
   FLAME ANIMATION
===================================================== */

@keyframes flicker {

  0% {

    transform:
      translateX(-50%)
      rotate(-4deg)
      scale(.94);

  }

  25% {

    transform:
      translateX(-50%)
      rotate(2deg)
      scale(1.02);

  }

  50% {

    transform:
      translateX(-50%)
      rotate(-2deg)
      scale(.97);

  }

  75% {

    transform:
      translateX(-50%)
      rotate(4deg)
      scale(1.06);

  }

  100% {

    transform:
      translateX(-50%)
      rotate(-1deg)
      scale(1);

  }

}


/* =====================================================
   HINT
===================================================== */

.hint {

  margin-top: 20px;

  font-size: 10px;

  letter-spacing: .15em;

  opacity: .55;

  transition:
    opacity 1s ease,
    transform 1s ease;
}


.hint.hidden {

  opacity: 0;

}


/* =====================================================
   FINAL SCENE
===================================================== */

.page.final-scene h1,
.page.final-scene .instruction,
.page.final-scene .cake-area,
.page.final-scene .hint {

  opacity: 0;

  transform:
    translateY(-15px)
    scale(.96);

  pointer-events: none;
}


/* =====================================================
   FINAL MESSAGE
===================================================== */

.message {

  position: fixed;

  left: 50%;
  top: 50%;

  width: 90%;
  max-width: 700px;

  transform:
    translate(-50%, -47%)
    scale(.92);

  opacity: 0;

  pointer-events: none;

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  transition:
    opacity 2s cubic-bezier(.22,1,.36,1),
    transform 2s cubic-bezier(.22,1,.36,1);
}


/* =====================================================
   CALLIGRAPHIC TEXT
===================================================== */

.message-text {

  font-family:
    "Snell Roundhand",
    "Segoe Script",
    "Bradley Hand",
    "Brush Script MT",
    cursive;

  font-size:
    clamp(43px, 9vw, 76px);

  font-weight: 400;

  letter-spacing: .01em;

  line-height: 1;

  color: #171717;

  opacity: 0;

  transform:
    translateY(20px);

  transition:
    opacity 1.8s ease,
    transform 1.8s cubic-bezier(.22,1,.36,1);
}


/* =====================================================
   LARGE HEART
===================================================== */

.message-heart {

  margin-top: 34px;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:
    clamp(70px, 15vw, 110px);

  line-height: .7;

  color: #171717;

  opacity: 0;

  transform:
    translateY(20px)
    scale(.55);

  transition:
    opacity 1.5s ease 1s,
    transform 1.7s cubic-bezier(.22,1,.36,1) 1s;
}


/* =====================================================
   FINAL MESSAGE VISIBLE
===================================================== */

.page.final-scene .message {

  opacity: 1;

  transform:
    translate(-50%, -50%)
    scale(1);
}


.page.final-scene .message-text {

  opacity: 1;

  transform:
    translateY(0);
}


.page.final-scene .message-heart {

  opacity: 1;

  transform:
    translateY(0)
    scale(1);

  animation:
    heartPulse 3.2s ease-in-out 2.5s infinite;
}


/* =====================================================
   HEART ANIMATION
===================================================== */

@keyframes heartPulse {

  0%,
  100% {

    transform:
      translateY(0)
      scale(1);

  }

  50% {

    transform:
      translateY(0)
      scale(1.07);

  }

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 500px) {

  h1 {
    font-size: 22px;
  }

  .instruction {
    font-size: 16px;
  }

  .cake {
    transform: scale(.92);
  }

  .message-text {
    white-space: normal;
  }

}

</style>

</head>


<body>


<div class="page" id="page">


  <!-- ===============================================
       FIRST SCENE
  ================================================ -->

  <h1>
    DEACHE TÖ T'ES MIA LÖM...
  </h1>


  <p class="instruction" id="instruction">
    Make a wish.
  </p>


  <div class="cake-area" id="cakeArea">


    <div class="cake" id="cake">


      <!-- ==========================================
           CAKE
      =========================================== -->

      <svg
        viewBox="0 0 230 190"
        xmlns="http://www.w3.org/2000/svg"
        aria-label="cake">


        <!-- shadow -->

        <ellipse
          cx="115"
          cy="170"
          rx="78"
          ry="11"
          fill="#000"
          opacity=".10"
        />


        <!-- bottom cake layer -->

        <path
          d="
          M43 105
          C43 94 76 87 115 87
          C154 87 187 94 187 105
          L187 143
          C187 155 155 163 115 163
          C75 163 43 155 43 143Z
          "

          fill="#d9b08b"

          stroke="#171717"

          stroke-width="2.2"
        />


        <!-- bottom shading -->

        <path
          d="
          M43 108
          C49 117 79 123 115 123
          C151 123 181 117 187 108
          L187 143
          C187 155 155 163 115 163
          C75 163 43 155 43 143Z
          "

          fill="#c9946d"

          opacity=".65"
        />


        <!-- cream -->

        <path
          d="
          M44 106
          C51 115 80 121 115 121
          C150 121 179 115 186 106
          L186 116
          C177 126 148 132 115 132
          C82 132 53 126 44 116Z
          "

          fill="#f1e3ca"

          stroke="#171717"

          stroke-width="1.7"
        />


        <!-- upper cake -->

        <path
          d="
          M48 80
          C48 69 78 61 115 61
          C152 61 182 69 182 80
          L182 106
          C182 117 151 124 115 124
          C79 124 48 117 48 106Z
          "

          fill="#dcb38e"

          stroke="#171717"

          stroke-width="2.2"
        />


        <!-- upper shading -->

        <path
          d="
          M48 83
          C56 91 83 96 115 96
          C147 96 174 91 182 83
          L182 106
          C182 117 151 124 115 124
          C79 124 48 117 48 106Z
          "

          fill="#c8956e"

          opacity=".55"
        />


        <!-- frosting -->

        <path
          d="
          M47 79
          C49 68 79 59 115 59
          C151 59 181 68 183 79
          C178 84 174 86 168 86
          C162 86 160 78 154 79
          C147 80 146 89 138 89
          C130 89 129 80 121 80
          C112 80 110 89 102 89
          C94 89 93 80 85 80
          C77 80 75 88 67 87
          C59 87 54 83 47 79Z
          "

          fill="#f4e7cf"

          stroke="#171717"

          stroke-width="2.2"
        />


        <!-- frosting highlight -->

        <path
          d="
          M64 72
          C78 66 94 64 115 64
          C136 64 153 66 166 72
          "

          fill="none"

          stroke="#fffaf0"

          stroke-width="3"

          stroke-linecap="round"

          opacity=".8"
        />


        <!-- decoration -->

        <circle
          cx="67"
          cy="103"
          r="2"
          fill="#171717"
          opacity=".45"
        />

        <circle
          cx="83"
          cy="110"
          r="2"
          fill="#171717"
          opacity=".35"
        />

        <circle
          cx="151"
          cy="105"
          r="2"
          fill="#171717"
          opacity=".4"
        />

        <circle
          cx="168"
          cy="112"
          r="2"
          fill="#171717"
          opacity=".3"
        />

      </svg>


      <!-- ==========================================
           DRAWN CANDLE
      =========================================== -->

      <div class="candle-box">

        <div class="wick"></div>

        <div class="flame"></div>

        <div class="candle-body"></div>

      </div>


    </div>

  </div>


  <!-- hint -->

  <div class="hint" id="hint">
    LIGHT THE CANDLE
  </div>


  <!-- =============================================
       FINAL MESSAGE
  ============================================== -->

  <div class="message" id="message">

    <div class="message-text">
      Döt l'bun Pice
    </div>

    <div class="message-heart">
      ♥
    </div>

  </div>


</div>


<script>

/* =====================================================
   ELEMENTS
===================================================== */

const page =
  document.getElementById("page");

const cakeArea =
  document.getElementById("cakeArea");

const cake =
  document.getElementById("cake");

const hint =
  document.getElementById("hint");


/* =====================================================
   STATE
===================================================== */

let lit = false;

let finished = false;


/* =====================================================
   CLICK
===================================================== */

cakeArea.addEventListener("click", function() {


  if (finished) {
    return;
  }


  /* -----------------------------------------------
     FIRST CLICK
     LIGHT CANDLE
  ------------------------------------------------ */

  if (!lit) {

    lit = true;

    cake.classList.add("lit");

    hint.textContent = "MAKE A WISH";

    return;
  }


  /* -----------------------------------------------
     SECOND CLICK
     EXTINGUISH CANDLE
  ------------------------------------------------ */

  lit = false;

  cake.classList.remove("lit");


  /*
    Let the flame disappear first.
  */

  setTimeout(function() {

    page.classList.add("final-scene");

    finished = true;

  }, 500);

});

</script>


</body>
</html>
