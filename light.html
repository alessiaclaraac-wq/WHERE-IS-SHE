<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DEACHE TÖ T'ES MIA LÖM...</title>

<style>

/* =========================
   GENERAL
========================= */

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;

  background: #f4f1ea;
  color: #171717;

  font-family: Arial, Helvetica, sans-serif;

  display: flex;
  justify-content: center;
  align-items: center;

  text-align: center;

  overflow: hidden;
}


/* =========================
   PAGE
========================= */

.page {
  width: 90%;
  max-width: 520px;

  padding: 40px 20px;

  transition:
    opacity 1.6s ease,
    transform 1.6s cubic-bezier(.22,1,.36,1);
}


/* =========================
   INTRO
========================= */

h1 {
  margin: 0 0 24px;

  font-size: 25px;
  font-weight: 400;

  letter-spacing: .03em;
  line-height: 1.35;

  transition:
    opacity 1.2s ease,
    transform 1.2s ease;
}

.instruction {
  margin: 0 0 55px;

  min-height: 26px;

  font-size: 17px;
  line-height: 1.55;

  font-style: italic;

  transition:
    opacity 1.2s ease,
    transform 1.2s ease;
}


/* =========================
   CAKE
========================= */

.cake-area {
  display: flex;
  flex-direction: column;
  align-items: center;

  cursor: pointer;

  user-select: none;
  -webkit-tap-highlight-color: transparent;

  transition:
    opacity 1.4s ease,
    transform 1.4s cubic-bezier(.22,1,.36,1);
}

.cake {
  position: relative;

  width: 230px;
  height: 190px;

  transition:
    transform .35s ease,
    opacity 1.3s ease;
}

.cake:hover {
  transform: scale(1.025);
}

.cake svg {
  width: 100%;
  height: 100%;

  overflow: visible;
}


/* =========================
   FLAME
========================= */

.flames {
  position: absolute;

  top: -2px;
  left: 50%;

  width: 38px;
  height: 48px;

  transform: translateX(-50%);

  pointer-events: none;

  opacity: 0;

  transition:
    opacity .45s ease;
}

.cake.lit .flames {
  opacity: 1;
}


/* soft glow */

.flames::before {
  content: "";

  position: absolute;

  width: 28px;
  height: 28px;

  left: 5px;
  top: 8px;

  background: #171717;

  border-radius: 50%;

  filter: blur(10px);

  opacity: .12;
}


/* outer flame */

.flame {
  position: absolute;

  left: 10px;
  top: 5px;

  width: 18px;
  height: 29px;

  background: #171717;

  border-radius:
    52% 48% 58% 42%;

  transform-origin: 50% 85%;

  transform:
    rotate(45deg)
    scale(.95);

  animation:
    naturalFlame
    .85s
    ease-in-out
    infinite
    alternate;
}


/* inner flame */

.flame::after {
  content: "";

  position: absolute;

  width: 9px;
  height: 16px;

  left: 5px;
  top: 8px;

  background: #f4f1ea;

  border-radius:
    55% 45% 60% 40%;

  transform:
    rotate(-7deg);

  opacity: .95;
}


/* little tip */

.flame::before {
  content: "";

  position: absolute;

  width: 7px;
  height: 13px;

  left: 7px;
  top: -6px;

  background: #171717;

  border-radius:
    65% 35% 60% 40%;

  transform:
    rotate(-15deg);
}


@keyframes naturalFlame {

  0% {
    transform:
      rotate(40deg)
      scale(.91)
      translate(0, 1px);
  }

  20% {
    transform:
      rotate(47deg)
      scale(1.02)
      translate(-1px, -1px);
  }

  45% {
    transform:
      rotate(42deg)
      scale(.96)
      translate(1px, 0);
  }

  70% {
    transform:
      rotate(49deg)
      scale(1.04)
      translate(-1px, -2px);
  }

  100% {
    transform:
      rotate(43deg)
      scale(.94)
      translate(1px, 1px);
  }

}


/* =========================
   HINT
========================= */

.hint {
  margin-top: 20px;

  font-size: 10px;

  letter-spacing: .15em;

  opacity: .55;

  transition:
    opacity 1s ease,
    transform 1s ease;
}


/* =========================
   FINAL TRANSITION
========================= */

/*
When the candle is blown out,
everything belonging to the first
scene disappears.
*/

.page.final-scene h1,
.page.final-scene .instruction,
.page.final-scene .cake-area,
.page.final-scene .hint {

  opacity: 0;

  transform:
    translateY(-12px)
    scale(.96);

  pointer-events: none;
}


/* =========================
   FINAL MESSAGE
========================= */

.message {
  position: fixed;

  left: 50%;
  top: 50%;

  width: 90%;
  max-width: 700px;

  transform:
    translate(-50%, -45%)
    scale(.94);

  opacity: 0;

  pointer-events: none;

  transition:
    opacity 2.2s cubic-bezier(.22,1,.36,1),
    transform 2.2s cubic-bezier(.22,1,.36,1);

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;
}


/* calligraphic sentence */

.message-text {

  font-family:
    "Snell Roundhand",
    "Segoe Script",
    "Bradley Hand",
    "Brush Script MT",
    cursive;

  font-size: clamp(42px, 9vw, 72px);

  font-weight: 400;

  letter-spacing: .01em;

  line-height: 1;

  white-space: nowrap;

  color: #171717;

  transform:
    translateY(15px);

  opacity: 0;

  transition:
    opacity 1.8s ease,
    transform 1.8s cubic-bezier(.22,1,.36,1);
}


/* big heart */

.message-heart {

  margin-top: 26px;

  font-family:
    Georgia,
    serif;

  font-size: clamp(55px, 12vw, 90px);

  line-height: .8;

  color: #171717;

  transform:
    translateY(15px)
    scale(.65);

  opacity: 0;

  transition:
    opacity 1.4s ease 1s,
    transform 1.6s cubic-bezier(.22,1,.36,1) 1s;
}


/* visible final scene */

.page.final-scene .message {

  opacity: 1;

  transform:
    translate(-50%, -50%)
    scale(1);
}

.page.final-scene .message-text {

  opacity: 1;

  transform:
    translateY(0);
}

.page.final-scene .message-heart {

  opacity: 1;

  transform:
    translateY(0)
    scale(1);

  animation:
    heartPulse
    3s
    ease-in-out
    2.5s
    infinite;
}


/* subtle heart pulse */

@keyframes heartPulse {

  0%, 100% {
    transform:
      translateY(0)
      scale(1);
  }

  50% {
    transform:
      translateY(0)
      scale(1.08);
  }

}


/* =========================
   MOBILE
========================= */

@media (max-width: 500px) {

  h1 {
    font-size: 22px;
  }

  .instruction {
    font-size: 16px;
  }

  .cake {
    transform: scale(.92);
  }

  .message-text {
    white-space: normal;
  }

}

</style>
</head>


<body>


<div class="page" id="page">


  <!-- FIRST SCENE -->

  <h1>
    DEACHE TÖ T'ES MIA LÖM...
  </h1>


  <p class="instruction" id="instruction">
    Make a wish.
  </p>


  <div class="cake-area" id="cakeArea">

    <div class="cake" id="cake">

        <!-- bottom cake -->

        <path

          "

          fill="#d9b08b"

        />


        <!-- bottom shading -->

        <path
          d="

          C151 123 181 117 187 108
          L187 143
          C187 155 155 163 115 163
          C75 163 43 155 43 143Z
          "

        />


        <!-- cream -->

        <path
          d="

          C150 121 179 115 186 106
          L186 116
          C177 126 148 132 115 132
          C82 132 53 126 44 116Z
          "

          fill="#f1e3ca"
          stroke="#171717"
          stroke-width="1.7"
        />


        <!-- upper cake -->

        <path
          d="
          M48 80

          C152 61 182 69 182 80
          L182 106
          C182 117 151 124 115 124
          C79 124 48 117 48 106Z
          "

          fill="#dcb38e"
          stroke="#171717"
          stroke-width="2.2"
        />


        <!-- upper shading -->

        <path
          d="
          M48 83
          C56 91 83 96 115 96
          C147 96 174 91 182 83
          L182 106
          C182 117 151 124 115 124
          C79 124 48 117 48 106Z
          "

          fill="#c8956e"
          opacity=".55"
        />


        <!-- frosting -->

        <path
          d="
          M47 79
          C49 68 79 59 115 59
          C151 59 181 68 183 79
          C178 84 174 86 168 86
          C162 86 160 78 154 79
          C147 80 146 89 138 89
          C130 89 129 80 121 80
          C112 80 110 89 102 89
          C94 89 93 80 85 80
          C77 80 75 88 67 87
          C59 87 54 83 47 79Z
          "

          fill="#f4e7cf"

        />


        <!-- frosting highlight -->

        <path
          d="
          M64 72

          C136 64 153 66 166 72

          fill="none"
          stroke="#fffaf0"

          opacity=".8"
        />


        <!-- decorative dots -->

        <circle
          cx="67"

          r="2"

        />

        <circle
          cx="83"
          cy="110"
          r="2"
          fill="#171717"
          opacity=".35"
        />

        <circle
          cx="151"
          cy="105"
          r="2"
          fill="#171717"
          opacity=".4"
        />

        <circle
          cx="168"
          cy="112"
          r="2"
          fill="#171717"
          opacity=".3"
        />


        <!-- ONE CANDLE -->

        <rect
          x="108"
          y="32"
          width="14"
          height="31"
          rx="3"

          fill="#e6d5b8"

          stroke="#171717"

        />


        <!-- candle stripes -->

        <path
          d="
          M108 39 L122 34
          M108 49 L122 44
          M108 59 L122 54

          stroke="#171717"
          stroke-width="1.5"

        />


        <!-- wick -->

        <path
          d="
          M115 32
          C114 27 116 24 115 21

          fill="none"

        />

      </svg>


      <!-- ONE FLAME -->

      <div class="flames">
        <div class="flame"></div>
      </div>

    </div>

  </div>


  <div class="hint" id="hint">
    LIGHT THE CANDLE
  </div>


  <!-- FINAL MESSAGE -->

  <div class="message" id="message">

    <div class="message-text">
      Döt l'bun pice
    </div>

    <div class="message-heart">
      ♥
    </div>

  </div>


</div>


<script>

const page =
  document.getElementById("page");

const cakeArea =
  document.getElementById("cakeArea");

const cake =
  document.getElementById("cake");

const instruction =
  document.getElementById("instruction");

const hint =
  document.getElementById("hint");


let lit = false;
let finished = false;


cakeArea.addEventListener("click", function() {

  if (finished) return;


  /* =========================
     FIRST CLICK
     LIGHT THE CANDLE
  ========================= */

  if (!lit) {

    lit = true;

    cake.classList.add("lit");

    hint.textContent = "MAKE A WISH";

    return;
  }


  /* =========================
     SECOND CLICK
     BLOW OUT CANDLE
  ========================= */

  lit = false;

  cake.classList.remove("lit");


  /*
    Small pause so the user
    sees the flame disappear
    before the whole scene fades.
  */

  setTimeout(function() {

    page.classList.add("final-scene");

    finished = true;

  }, 450);

});

</script>

</body>
</html>
