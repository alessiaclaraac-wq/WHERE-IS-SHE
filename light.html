<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A LIGHT FROM NEPAL</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #f4f1ea;
  color: #171717;
  font-family: Arial, Helvetica, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
}

.page {
  width: 90%;
  max-width: 520px;
  padding: 40px 20px;
}

h1 {
  margin: 0 0 22px;
  font-size: 25px;
  font-weight: 400;
  letter-spacing: .03em;
}

.instruction {
  margin: 0 0 58px;
  font-size: 17px;
  line-height: 1.55;
  font-style: italic;
  min-height: 26px;
}

/* CAKE AREA */

.cake-area {
  display: flex;
  flex-direction: column;
  align-items: center;
  cursor: pointer;
  user-select: none;
}

/* CANDLE */

.candle {
  position: relative;
  width: 9px;
  height: 52px;
  background: #171717;
  margin-bottom: 0;
}

.flame {
  position: absolute;
  left: 50%;
  top: -25px;
  width: 13px;
  height: 19px;
  background: #171717;
  border-radius: 50% 50% 50% 0;
  transform: translateX(-50%) rotate(45deg);
  opacity: 0;
}

.candle.lit .flame {
  opacity: 1;
  animation: flicker .7s infinite alternate;
}

@keyframes flicker {
  from {
    transform: translateX(-50%) rotate(43deg) scale(1);
  }
  to {
    transform: translateX(-50%) rotate(48deg) scale(1.08);
  }
}

/* CAKE */

.cake {
  position: relative;
  width: 190px;
  height: 75px;
}

/* top icing */

.cake-top {
  position: absolute;
  left: 8px;
  top: 0;
  width: 174px;
  height: 30px;
  background: #171717;
  border-radius: 50%;
}

/* cake body */

.cake-body {
  position: absolute;
  left: 15px;
  top: 14px;
  width: 160px;
  height: 55px;
  background: #171717;
  border-radius: 4px 4px 15px 15px;
}

/* icing drips */

.drip {
  position: absolute;
  top: 17px;
  width: 13px;
  height: 22px;
  background: #171717;
  border-radius: 0 0 10px 10px;
  z-index: 2;
}

.drip.one {
  left: 35px;
}

.drip.two {
  left: 70px;
  height: 17px;
}

.drip.three {
  right: 65px;
  height: 21px;
}

.drip.four {
  right: 38px;
  height: 15px;
}

/* small details on cake */

.decoration {
  position: absolute;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: #f4f1ea;
  opacity: .7;
  z-index: 3;
}

.decoration.one {
  left: 45px;
  top: 43px;
}

.decoration.two {
  left: 88px;
  top: 54px;
}

.decoration.three {
  right: 47px;
  top: 44px;
}

/* HINT */

.hint {
  margin-top: 28px;
  font-size: 10px;
  letter-spacing: .15em;
  opacity: .55;
  transition: opacity .5s ease;
}

.hint.hidden {
  opacity: 0;
}

/* MESSAGE */

.message {
  margin-top: 52px;
  font-size: 20px;
  letter-spacing: .02em;
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 1.5s ease, transform 1.5s ease;
  pointer-events: none;
}

.message.visible {
  opacity: 1;
  transform: translateY(0);
}
</style>
</head>

<body>

<div class="page">

  <h1>A LIGHT FROM NEPAL</h1>

  <p class="instruction" id="instruction">
    Make a wish.
  </p>

  <div class="cake-area" id="cakeArea">

    <div class="candle" id="candle">
      <div class="flame"></div>
    </div>

    <div class="cake">

      <div class="cake-top"></div>

      <div class="cake-body"></div>

      <div class="drip one"></div>
      <div class="drip two"></div>
      <div class="drip three"></div>
      <div class="drip four"></div>

      <div class="decoration one"></div>
      <div class="decoration two"></div>
      <div class="decoration three"></div>

    </div>

  </div>

  <div class="hint" id="hint">
    LIGHT THE CANDLE
  </div>

  <div class="message" id="message">
    Döt l'bun Pice ❤️
  </div>

</div>

<script>

const cakeArea = document.getElementById("cakeArea");
const candle = document.getElementById("candle");
const instruction = document.getElementById("instruction");
const hint = document.getElementById("hint");
const message = document.getElementById("message");

let lit = false;
let finished = false;

cakeArea.addEventListener("click", function() {

  if (finished) return;

  if (!lit) {

    lit = true;
    candle.classList.add("lit");

    hint.textContent = "BLOW IT OUT";

  } else {

    lit = false;
    candle.classList.remove("lit");

    instruction.textContent = "";
    hint.classList.add("hidden");

    setTimeout(function() {
      message.classList.add("visible");
      finished = true;
    }, 900);

  }

});

</script>

</body>
</html>
