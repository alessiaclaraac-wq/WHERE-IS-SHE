<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DEACHE TÖ T'ES MIA LÖM...</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #f4f1ea;
  color: #171717;
  font-family: Arial, Helvetica, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
}

.page {
  width: 90%;
  max-width: 520px;
  padding: 40px 20px;
}

h1 {
  margin: 0 0 24px;
  font-size: 25px;
  font-weight: 400;
  letter-spacing: .03em;
  line-height: 1.35;
}

.instruction {
  margin: 0 0 55px;
  min-height: 26px;
  font-size: 17px;
  line-height: 1.55;
  font-style: italic;
}

/* CAKE */

.cake-area {
  display: flex;
  flex-direction: column;
  align-items: center;
  cursor: pointer;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

.cake {
  position: relative;
  display: inline-block;
  font-size: 125px;
  line-height: 1;
}

/* FLAMES */

.flames {
  position: absolute;
  top: -7px;
  left: 50%;
  width: 100px;
  height: 35px;
  transform: translateX(-50%);
  pointer-events: none;
  opacity: 0;
  transition: opacity .4s ease;
}

.cake.lit .flames {
  opacity: 1;
}

.flame {
  position: absolute;
  width: 12px;
  height: 20px;
  background: #171717;
  border-radius: 70% 40% 65% 40%;
  transform: rotate(45deg);
  animation: flicker .7s ease-in-out infinite alternate;
}

.flame:nth-child(1) {
  left: 24px;
  top: 5px;
}

.flame:nth-child(2) {
  left: 44px;
  top: 0;
  animation-delay: .15s;
}

.flame:nth-child(3) {
  left: 64px;
  top: 5px;
  animation-delay: .3s;
}

@keyframes flicker {
  0% {
    transform: rotate(43deg) scale(.9);
  }

  50% {
    transform: rotate(48deg) scale(1.08);
  }

  100% {
    transform: rotate(42deg) scale(.96);
  }
}

/* HINT */

.hint {
  margin-top: 30px;
  font-size: 10px;
  letter-spacing: .15em;
  opacity: .55;
  transition: opacity .5s ease;
}

.hint.hidden {
  opacity: 0;
}

/* FINAL MESSAGE */

.message {
  margin-top: 50px;
  font-size: 20px;
  letter-spacing: .02em;
  opacity: 0;
  transform: translateY(8px);
  transition:
    opacity 1.5s ease,
    transform 1.5s ease;
  pointer-events: none;
}

.message.visible {
  opacity: 1;
  transform: translateY(0);
}
</style>
</head>

<body>

<div class="page">

  <h1>DEACHE TÖ T'ES MIA LÖM...</h1>

  <p class="instruction" id="instruction">
    Make a wish.
  </p>

  <div class="cake-area" id="cakeArea">

    <div class="cake" id="cake">

      🎂

      <div class="flames">
        <div class="flame"></div>
        <div class="flame"></div>
        <div class="flame"></div>
      </div>

    </div>

  </div>

  <div class="hint" id="hint">
    LIGHT THE CANDLES
  </div>

  <div class="message" id="message">
    Döt l'bun Pice ❤️
  </div>

</div>

<script>

const cakeArea = document.getElementById("cakeArea");
const cake = document.getElementById("cake");
const instruction = document.getElementById("instruction");
const hint = document.getElementById("hint");
const message = document.getElementById("message");

let lit = false;
let finished = false;

cakeArea.addEventListener("click", function() {

  if (finished) return;

  if (!lit) {

    // ACCENDI LE CANDELE
    lit = true;
    cake.classList.add("lit");

    hint.textContent = "MAKE A WISH";

  } else {

    // SPEGNI LE CANDELE
    lit = false;
    cake.classList.remove("lit");

    instruction.textContent = "";
    hint.classList.add("hidden");

    setTimeout(function() {
      message.classList.add("visible");
      finished = true;
    }, 900);

  }

});

</script>

</body>
</html>
