<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WHERE IS SHE?</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f1ea;
      color: #171717;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
    }

    .page {
      width: min(90%, 560px);
      padding: 40px 20px;
    }

    h1 {
      margin: 0 0 55px;
      font-size: clamp(30px, 8vw, 58px);
      font-weight: 700;
      letter-spacing: -0.04em;
    }

    .date {
      margin-bottom: 24px;
      font-size: 15px;
      letter-spacing: 0.12em;
      font-weight: 600;
    }

    .location {
      margin-bottom: 42px;
      font-size: 18px;
      line-height: 1.5;
    }

    .button {
      display: inline-block;
      padding: 15px 28px;
      border: 1.5px solid #171717;
      color: #171717;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.12em;
      transition: background 0.2s, color 0.2s;
    }

    .button:hover {
      background: #171717;
      color: #f4f1ea;
    }

    .countdown {
      margin-top: 28px;
      font-size: 13px;
      font-style: italic;
      opacity: 0.65;
    }

    .back {
      margin-top: 40px;
      font-size: 19px;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <main class="page">
    <h1>WHERE IS SHE?</h1>

    <div id="content"></div>
  </main>

  <script>
    // Your private Polarsteps link
    const polarsteps =
      "https://www.polarsteps.com/AlessiaClara/29287866-una-nuova-avventura?s=29440041-2919-4ec7-a1d2-c248ff678eff&referral=true";

    const content = document.getElementById("content");

    // The calendar is based on the viewer's device date.
    const today = new Date();
    const year = today.getFullYear();
    const month = today.getMonth() + 1;
    const day = today.getDate();

    // November 10–17, 2026
    if (year === 2026 && month === 11 && day >= 10 && day <= 16) {
      const daysLeft = 17 - day;

      content.innerHTML = `
        <div class="date">${day} NOVEMBER 2026</div>
        <div class="location">Somewhere in Nepal.</div>

        <a class="button" href="${polarsteps}" target="_blank" rel="noopener">
          FIND ME
        </a>

        <div class="countdown">
          You have ${daysLeft} day${daysLeft === 1 ? "" : "s"} left.
        </div>
      `;
    } else if (year === 2026 && month === 11 && day === 17) {
      content.innerHTML = `
        <div class="date">17 NOVEMBER 2026</div>

        <div class="back">
          You don't need to look for me anymore.<br>
          I'm back.
        </div>
      `;
    } else if (year === 2026 && month === 11 && day > 17) {
      content.innerHTML = `
        <div class="date">17 NOVEMBER 2026</div>

        <div class="back">
          You don't need to look for me anymore.<br>
          I'm back.
        </div>
      `;
    } else {
      // Preview shown before November 10
      content.innerHTML = `
        <div class="date">10 NOVEMBER 2026</div>
        <div class="location">Somewhere in Nepal.</div>

        <a class="button" href="${polarsteps}" target="_blank" rel="noopener">
          FIND ME
        </a>

        <div class="countdown">
          You have 7 days left.
        </div>
      `;
    }
  </script>
</body>
</html>
