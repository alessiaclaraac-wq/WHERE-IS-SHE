<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A STORY FROM NEPAL</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f4f1ea;color:#171717;font-family:Arial,Helvetica,sans-serif;display:flex;justify-content:center;align-items:center;text-align:center}.page{width:90%;max-width:520px;padding:40px 20px}h1{margin:0 0 34px;font-size:25px;font-weight:400;letter-spacing:.03em}.intro{margin:0 0 8px;font-size:17px;line-height:1.55;font-style:italic}.second-line{margin-bottom:42px}.player{display:flex;flex-direction:column;align-items:center}.play-button{width:64px;height:64px;border:1px solid #171717;border-radius:50%;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}.play-button:hover{background:rgba(23,23,23,.05)}.triangle{width:0;height:0;border-top:8px solid transparent;border-bottom:8px solid transparent;border-left:12px solid #171717;margin-left:4px}.pause{display:flex;gap:5px}.pause span{width:3px;height:17px;background:#171717}.label{margin-top:13px;font-size:11px;letter-spacing:.16em}.progress-area{width:100%;max-width:280px;margin-top:25px}.progress-line{width:100%;height:1px;background:rgba(23,23,23,.22);cursor:pointer;position:relative}.progress{position:absolute;left:0;top:0;height:1px;width:0%;background:#171717}.time{display:flex;justify-content:space-between;margin-top:8px;font-size:10px;letter-spacing:.04em;opacity:.65}
</style>
</head>
<body>
<div class="page">
<h1>A STORY FROM NEPAL</h1>
<p class="intro">Normalmënter lieste tö por me.</p>
<p class="intro second-line">Incö lii iö por te.</p>
<div class="player">
<button class="play-button" id="playButton" aria-label="Play"><span class="triangle" id="icon"></span></button>
<div class="label" id="label">PLAY</div>
<div class="progress-area"><div class="progress-line" id="progressLine"><div class="progress" id="progress"></div></div><div class="time"><span id="currentTime">0:00</span><span id="duration">0:00</span></div></div>
</div>
<audio id="audio" preload="metadata"><source src="a-story-from-nepal.m4a" type="audio/mp4"></audio>
</div>
<script>
const audio=document.getElementById('audio'),button=document.getElementById('playButton'),icon=document.getElementById('icon'),label=document.getElementById('label'),progress=document.getElementById('progress'),progressLine=document.getElementById('progressLine'),currentTime=document.getElementById('currentTime'),duration=document.getElementById('duration');
function formatTime(s){if(!isFinite(s))return'0:00';const m=Math.floor(s/60),sec=Math.floor(s%60).toString().padStart(2,'0');return `${m}:${sec}`}
button.addEventListener('click',()=>audio.paused?audio.play():audio.pause());
audio.addEventListener('play',()=>{icon.className='pause';icon.innerHTML='<span></span><span></span>';label.textContent='PAUSE'});
audio.addEventListener('pause',()=>{icon.className='triangle';icon.innerHTML='';label.textContent='PLAY'});
audio.addEventListener('loadedmetadata',()=>duration.textContent=formatTime(audio.duration));
audio.addEventListener('timeupdate',()=>{currentTime.textContent=formatTime(audio.currentTime);if(audio.duration)progress.style.width=(audio.currentTime/audio.duration*100)+'%'});
audio.addEventListener('ended',()=>{progress.style.width='0%';currentTime.textContent='0:00'});
progressLine.addEventListener('click',e=>{if(!audio.duration)return;const r=progressLine.getBoundingClientRect();audio.currentTime=((e.clientX-r.left)/r.width)*audio.duration});
</script>
</body>
</html>
